# Builds TOSS Terminal for macOS as an unsigned app and uploads it as an
# artifact. Upstream's release.yml needs signing secrets this fork doesn't
# have. TOSS Terminal has its own identifier (app.toss.terminal) and no
# updater; new builds are installed by hand.
name: fork-build

on:
  workflow_dispatch:
  push:
    branches: [tuios-tiling, tuios-tiling-v086]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build the unsigned app
        run: pnpm tauri build --bundles app --no-sign
      - name: Test dictation, migration and agent detection
        working-directory: src-tauri
        run: cargo test --release --lib -- stt::tests migrate::tests agent_detect::tests
      - name: Measure the app
        working-directory: src-tauri/target/release/bundle/macos
        run: du -sh "TOSS Terminal.app" "TOSS Terminal.app/Contents/MacOS/"*
      - name: Zip the app
        working-directory: src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent "TOSS Terminal.app" toss-terminal-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: toss-terminal-macos
          path: src-tauri/target/release/bundle/macos/toss-terminal-macos.zip

  # Ubuntu 26.04 .deb, built on 26.04 itself so its dependencies match.
  linux:
    runs-on: ubuntu-26.04
    env:
      # Build whisper.cpp for a common x86-64 baseline (AVX2), not this
      # runner's CPU, so the app runs on other people's machines.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            cmake \
            build-essential
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build the .deb
        run: pnpm tauri build --bundles deb
      - name: Test dictation, migration and agent detection
        working-directory: src-tauri
        run: cargo test --release --lib -- stt::tests migrate::tests agent_detect::tests
      - name: Measure and describe the package
        working-directory: src-tauri/target/release/bundle/deb
        run: |
          ls -la *.deb
          dpkg-deb --info *.deb | grep -E "Package|Version|Architecture|Depends|Installed-Size"
          cp *.deb toss-terminal_amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: toss-terminal-ubuntu-deb
          path: src-tauri/target/release/bundle/deb/toss-terminal_amd64.deb

